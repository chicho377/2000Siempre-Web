<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 48">
  <!-- Definiciones de gradientes -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F57C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="wheelGrad">
      <stop offset="0%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90CAF9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Orugas -->
  <rect x="12" y="34" width="50" height="10" rx="5" fill="url(#trackGrad)" stroke="#000" stroke-width="1.5"/>
  
  <!-- Patrón de oruga -->
  <rect x="14" y="36" width="46" height="6" rx="3" fill="#1a1a1a" opacity="0.5"/>
  <line x1="18" y1="36" x2="18" y2="42" stroke="#404040" stroke-width="1"/>
  <line x1="24" y1="36" x2="24" y2="42" stroke="#404040" stroke-width="1"/>
  <line x1="30" y1="36" x2="30" y2="42" stroke="#404040" stroke-width="1"/>
  <line x1="36" y1="36" x2="36" y2="42" stroke="#404040" stroke-width="1"/>
  <line x1="42" y1="36" x2="42" y2="42" stroke="#404040" stroke-width="1"/>
  <line x1="48" y1="36" x2="48" y2="42" stroke="#404040" stroke-width="1"/>
  <line x1="54" y1="36" x2="54" y2="42" stroke="#404040" stroke-width="1"/>
  
  <!-- Ruedas de la oruga -->
  <circle cx="18" cy="39" r="3.5" fill="url(#wheelGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="18" cy="39" r="1.5" fill="#2a2a2a"/>
  
  <circle cx="30" cy="39" r="3.5" fill="url(#wheelGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="30" cy="39" r="1.5" fill="#2a2a2a"/>
  
  <circle cx="42" cy="39" r="3.5" fill="url(#wheelGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="42" cy="39" r="1.5" fill="#2a2a2a"/>
  
  <circle cx="54" cy="39" r="3.5" fill="url(#wheelGrad)" stroke="#000" stroke-width="1"/>
  <circle cx="54" cy="39" r="1.5" fill="#2a2a2a"/>
  
  <!-- Plataforma giratoria -->
  <rect x="20" y="26" width="28" height="8" rx="2" fill="url(#blueGrad)" stroke="#0D47A1" stroke-width="1.5"/>
  <line x1="22" y1="30" x2="46" y2="30" stroke="#0A3D91" stroke-width="1"/>
  
  <!-- Contrapeso trasero -->
  <rect x="12" y="20" width="14" height="12" rx="2" fill="url(#blueGrad)" stroke="#0D47A1" stroke-width="1.5"/>
  <!-- Rejillas del contrapeso -->
  <line x1="14" y1="22" x2="24" y2="22" stroke="#0A3D91" stroke-width="0.5"/>
  <line x1="14" y1="24" x2="24" y2="24" stroke="#0A3D91" stroke-width="0.5"/>
  <line x1="14" y1="26" x2="24" y2="26" stroke="#0A3D91" stroke-width="0.5"/>
  <line x1="14" y1="28" x2="24" y2="28" stroke="#0A3D91" stroke-width="0.5"/>
  <line x1="14" y1="30" x2="24" y2="30" stroke="#0A3D91" stroke-width="0.5"/>
  
  <!-- Cabina principal -->
  <rect x="26" y="14" width="20" height="14" rx="2" fill="url(#blueGrad)" stroke="#0D47A1" stroke-width="1.5"/>
  
  <!-- Techo de la cabina -->
  <path d="M 26 14 L 28 11 L 44 11 L 46 14 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="1.5"/>
  
  <!-- Ventana frontal -->
  <rect x="30" y="17" width="8" height="7" rx="1" fill="url(#windowGrad)" stroke="#0D47A1" stroke-width="1"/>
  <!-- Reflejo en ventana -->
  <rect x="31" y="18" width="3" height="2" rx="0.5" fill="#fff" opacity="0.6"/>
  
  <!-- Ventana lateral -->
  <rect x="40" y="18" width="5" height="6" rx="1" fill="url(#windowGrad)" stroke="#0D47A1" stroke-width="1"/>
  
  <!-- Línea de puerta -->
  <line x1="38" y1="16" x2="38" y2="27" stroke="#0A3D91" stroke-width="1"/>
  
  <!-- Detalles de ventilación -->
  <line x1="41" y1="25" x2="44" y2="25" stroke="#0A3D91" stroke-width="0.5"/>
  <line x1="41" y1="26.5" x2="44" y2="26.5" stroke="#0A3D91" stroke-width="0.5"/>
  
  <!-- Cilindro hidráulico del brazo -->
  <rect x="38" y="12" width="2.5" height="10" rx="1" fill="#9E9E9E" stroke="#616161" stroke-width="0.8"/>
  <circle cx="39.25" cy="12" r="1.5" fill="#757575" stroke="#424242" stroke-width="0.8"/>
  
  <!-- Brazo principal (boom) -->
  <rect x="32" y="6" width="30" height="5" rx="2" fill="url(#armGrad)" stroke="#E65100" stroke-width="1.5"/>
  <!-- Detalle del brazo -->
  <line x1="34" y1="8.5" x2="60" y2="8.5" stroke="#E65100" stroke-width="0.8"/>
  
  <!-- Articulación del brazo -->
  <circle cx="62" cy="8.5" r="2.5" fill="#424242" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="62" cy="8.5" r="1.2" fill="#2a2a2a"/>
  
  <!-- Cilindro hidráulico del stick -->
  <rect x="56" y="8" width="2" height="8" rx="0.8" fill="#9E9E9E" stroke="#616161" stroke-width="0.8"/>
  
  <!-- Brazo secundario (stick) -->
  <rect x="58" y="10" width="14" height="4" rx="1.5" fill="url(#armGrad)" stroke="#E65100" stroke-width="1.5"/>
  <line x1="59" y1="12" x2="71" y2="12" stroke="#E65100" stroke-width="0.8"/>
  
  <!-- Articulación del stick -->
  <circle cx="72" cy="12" r="2" fill="#424242" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="72" cy="12" r="1" fill="#2a2a2a"/>
  
  <!-- Cucharón -->
  <path d="M 70 14 L 77 16 L 78 21 L 70 19 Z" fill="#616161" stroke="#212121" stroke-width="1.5"/>
  <path d="M 70 14 L 77 16 L 78 21 L 70 19 Z" fill="#757575" opacity="0.5"/>
  
  <!-- Dientes del cucharón -->
  <polygon points="77,16 78,16 78.5,21" fill="#1a1a1a"/>
  <polygon points="74.5,15.5 75.5,15.5 76.5,20.5" fill="#1a1a1a"/>
  <polygon points="72,15 73,15 74.5,20" fill="#1a1a1a"/>
  
  <!-- Borde superior del cucharón -->
  <line x1="70" y1="14" x2="77" y2="16" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Tubo de escape -->
  <rect x="44" y="10" width="2.5" height="6" rx="1" fill="#616161" stroke="#424242" stroke-width="1"/>
  <rect x="44" y="9" width="2.5" height="2" rx="0.8" fill="#424242" stroke="#212121" stroke-width="0.8"/>
  
  <!-- Humo del escape -->
  <circle cx="45.25" cy="7" r="1.5" fill="#888" opacity="0.3"/>
  <circle cx="45.75" cy="5" r="1.8" fill="#888" opacity="0.2"/>
  
  <!-- Sombra debajo -->
  <ellipse cx="37" cy="45" rx="28" ry="2" fill="#000" opacity="0.15"/>
</svg>